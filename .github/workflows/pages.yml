name: Build and publish to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '27 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Download and build the current dataset
        run: |
          python3 -m venv "$RUNNER_TEMP/atlas-env"
          "$RUNNER_TEMP/atlas-env/bin/python" -m pip install -r requirements.txt
          "$RUNNER_TEMP/atlas-env/bin/python" scripts/build.py
          test -s dist/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
